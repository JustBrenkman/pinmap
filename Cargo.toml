[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ben Brenkman <justbrenkman@gmail.com>"]
repository = "https://github.com/JustBrenkman/pinmap"
homepage = "https://github.com/JustBrenkman/pinmap"
readme = "README.md"
keywords = ["embedded", "pinout", "devicetree", "zephyr", "kicad"]
categories = ["embedded", "command-line-utilities"]

[workspace.dependencies]
pinmap-model = { path = "crates/pinmap-model", version = "0.1.0" }
pinmap-core = { path = "crates/pinmap-core", version = "0.1.0" }
pinmap-dts = { path = "crates/pinmap-dts", version = "0.1.0" }
pinmap-import = { path = "crates/pinmap-import", version = "0.1.0" }
pinmap-emit = { path = "crates/pinmap-emit", version = "0.1.0" }

clap = { version = "4.6", features = ["derive"] }
indexmap = { version = "2.14", features = ["serde"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27"
thiserror = "2"
